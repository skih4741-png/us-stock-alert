name: 과거 검증
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "거래대금 상위 몇 개로 검증할까요"
        default: "400"
      years:
        description: "최근 몇 년"
        default: "3"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NAVER_ID: ${{ secrets.NAVER_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      NAVER_APP_PASSWORD: ${{ secrets.NAVER_APP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install yfinance pandas numpy requests
      - run: python backtest.py --tickers ${{ github.event.inputs.tickers }} --years ${{ github.event.inputs.years }} --send
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: data/backtest_report.md
