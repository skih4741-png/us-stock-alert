name: Research-only historical portfolio sample

on:
  pull_request:
    paths:
      - "validation/**"
      - "execution_rules.py"
      - "backtest.py"
      - ".github/workflows/research-portfolio.yml"
  workflow_dispatch:

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Download historical daily prices and compare three portfolios
        run: python -m validation.run_portfolio --tickers 20 --years 2
      - name: Archive research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-portfolio
          path: data/portfolio_comparison.json
          if-no-files-found: warn
