name: 연결 점검 (GPT · 한국투자증권 모의 · 경제뉴스)
on:
  workflow_dispatch:
    inputs:
      news:
        description: "경제뉴스 리포트도 지금 만들기"
        type: boolean
        default: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
      KIS_ACCOUNT_PROD: ${{ secrets.KIS_ACCOUNT_PROD }}
      KIS_MODE: ${{ secrets.KIS_MODE }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: GPT 점검 (키 값은 출력하지 않아요)
        run: python ai.py
      - name: 한국투자증권 모의투자 점검 (주문은 안 내요)
        run: python kis.py
      - name: 경제뉴스 리포트 만들기 (선택)
        if: ${{ inputs.news }}
        run: python news.py --send
