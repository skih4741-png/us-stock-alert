name: 아침 리포트
on:
  schedule:
    - cron: "0 22 * * 1-5"   # 한국 화~토 07:00
  workflow_dispatch:
    inputs:
      limit:
        description: "시험용: 거래대금 상위 몇 개만 (비우면 전체)"
        required: false
        default: ""
      force:
        description: "휴장일에도 강제 전체 실행 (AI·위원회까지)"
        type: boolean
        required: false
        default: false
permissions:
  contents: write
concurrency:
  group: stock-alert
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      NAVER_ID: ${{ secrets.NAVER_ID }}
      NAVER_APP_PASSWORD: ${{ secrets.NAVER_APP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      STRATEGY_POLICY_HMAC_KEY: ${{ secrets.STRATEGY_POLICY_HMAC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      HF_API_KEY: ${{ secrets.HF_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
      KIS_ACCOUNT_PROD: ${{ secrets.KIS_ACCOUNT_PROD }}
      KIS_MODE: ${{ secrets.KIS_MODE }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      WEB_URL: ${{ vars.WEB_URL }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 아침 분석
        run: |
          FORCE=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then FORCE="--force"; fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            python main.py daily --limit ${{ github.event.inputs.limit }} $FORCE
          else
            python main.py daily $FORCE
          fi
      - name: 실패 시 GitHub 실행 로그 링크 알림
        if: failure()
        shell: bash
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            printf '{"text":"🚨 미국주식 아침 예약 실행 실패 · 실패 단계와 로그: <%s|GitHub Actions 실행 기록>"}' "$RUN_URL" | curl -fsS --max-time 15 -X POST -H "Content-Type: application/json" --data-binary @- "$SLACK_WEBHOOK_URL" || true
          else
            echo "::warning::SLACK_WEBHOOK_URL is empty; no delivery channel for workflow failure"
          fi
      - name: 기록 저장 (저장소 활동 유지)
        if: always()
        run: |
          git config user.name "stock-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json data/fundamentals.json data/universe_cache.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "기록 $(date -u +%F)"
          git push || true
