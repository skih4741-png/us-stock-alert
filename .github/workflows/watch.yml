name: 장 전 점검·장중 감시
on:
  schedule:
    - cron: "0 13-21 * * 1-5"   # 한국 22:00~06:00 매시 (코드가 장중인지 확인)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stock-alert
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install yfinance pandas numpy requests gspread google-auth
      - run: python main.py premarket
      - run: python main.py intraday
      - name: 알림 기록 저장
        run: |
          git config user.name "stock-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "장중 알림 기록"
          git push || true
