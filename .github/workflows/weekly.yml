name: 주간 요약
on:
  schedule:
    - cron: "0 11 * * 0"   # 한국 일요일 20:00
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      NAVER_ID: ${{ secrets.NAVER_ID }}
      NAVER_APP_PASSWORD: ${{ secrets.NAVER_APP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
      KIS_ACCOUNT_PROD: ${{ secrets.KIS_ACCOUNT_PROD }}
      KIS_MODE: ${{ secrets.KIS_MODE }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install yfinance pandas numpy requests gspread google-auth pywebpush
      - run: python main.py weekly
